[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --strict-markers
    -p no:warnings
markers =
    unit: Unit tests (no external dependencies)
    tools: Tool integration tests
    slow: Tests that take > 5 seconds
    azure: Tests requiring Azure credentials
asyncio_mode = auto
